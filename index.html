<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#080b17" />
<meta name="description" content="TFT Set 19 Prismatic Tour 대회 대비 개인 훈련 프로그램 — 팀 빌더, 운영 시뮬레이터, 증강 연구, 정찰, 판단력 훈련, 대회 기록" />
<title>TFT Tournament Lab · Set 19</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TFT Lab" />
<meta name="application-name" content="TFT Lab" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<header class="app-header">
  <div class="brand"><div class="logo">TL</div><div><h1>TFT TOURNAMENT LAB</h1><small>Set 19 · Prismatic Tour · 대회 대비 훈련</small></div></div>
  <div class="row nw" style="gap:8px"><div class="hdr-status" id="hdrStatus"></div><button class="sm gold hide" id="installBtn" title="홈 화면/데스크톱에 앱으로 설치">⬇ 앱 설치</button></div>
</header>
<div class="layout-root">
  <nav class="side" id="nav" aria-label="주요 메뉴">
    <button data-view="dashboard" class="active"><span class="n">1</span><span class="t">Dashboard<small>대시보드</small></span></button>
    <button data-view="builder"><span class="n">2</span><span class="t">Team Builder<small>덱 구성 연구실</small></span></button>
    <button data-view="meta"><span class="n">3</span><span class="t">Meta Comps<small>PBE 메타 덱</small></span></button>
    <button data-view="sim"><span class="n">4</span><span class="t">Game Simulator<small>운영 시뮬레이터</small></span></button>
    <button data-view="augments"><span class="n">5</span><span class="t">Augment Lab<small>증강체 연구실</small></span></button>
    <button data-view="scout"><span class="n">6</span><span class="t">Scouting<small>정찰 · 배치 훈련</small></span></button>
    <button data-view="drill"><span class="n">7</span><span class="t">Decision Training<small>판단력 훈련</small></span></button>
    <button data-view="records"><span class="n">8</span><span class="t">Tournament Records<small>대회 · 스크림 기록</small></span></button>
    <button data-view="settings"><span class="n">9</span><span class="t">Data &amp; Settings<small>데이터 · 설정</small></span></button>
    <div class="navfoot" id="navFoot"></div>
  </nav>
  <main id="main">
    <noscript><div class="notice red">이 프로그램은 JavaScript가 필요해. 브라우저에서 JavaScript를 켜 줘.</div></noscript>
    <div id="bootMsg" class="notice blue">데이터를 불러오는 중…</div>
    <section id="view-dashboard" class="view active"></section>
    <section id="view-builder" class="view"></section>
    <section id="view-meta" class="view"></section>
    <section id="view-sim" class="view"></section>
    <section id="view-augments" class="view"></section>
    <section id="view-scout" class="view"></section>
    <section id="view-drill" class="view"></section>
    <section id="view-records" class="view"></section>
    <section id="view-settings" class="view"></section>
    <footer class="foot">TFT Tournament Lab은 비공식 팬 제작 훈련 도구이며 Riot Games의 승인·후원을 받지 않았습니다. Teamfight Tactics 및 관련 자산의 권리는 Riot Games에 있습니다.</footer>
  </main>
</div>
<div class="modal-back" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal"><div class="row between"><h3 id="modalTitle">안내</h3><button class="sm" id="modalClose" aria-label="닫기">닫기</button></div><div id="modalBody" style="margin-top:10px"></div><div id="modalFoot" class="row" style="justify-content:flex-end;margin-top:12px"></div></div>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="data/bundle.js"></script>
<script src="assets/index.js"></script>
<script src="js/core.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/builder.js"></script>
<script src="js/meta.js"></script>
<script src="js/sim.js"></script>
<script src="js/augments.js"></script>
<script src="js/scout.js"></script>
<script src="js/drill.js"></script>
<script src="js/records.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
